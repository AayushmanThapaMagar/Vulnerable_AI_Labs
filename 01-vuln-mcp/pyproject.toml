[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-security-lab"
version = "0.1.0"
description = "A local security training lab for MCP-based applications"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mcp==2.3.0",
]

[project.optional-dependencies]
test = [
    "pytest==9.2.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["mcp_security_lab*"]